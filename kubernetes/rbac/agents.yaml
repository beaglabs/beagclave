apiVersion: v1
kind: ServiceAccount
metadata:
  name: beagclave-agent
  namespace: beagclave-agents
  annotations:
    azure.workload.identity/client-id: "{{BEAGCLAVE_AGENT_CLIENT_ID}}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: beagclave-agent-role
  namespace: beagclave-agents
rules:
- apiGroups: ["", "apps", "batch"]
  resources: ["pods", "pods/log", "deployments", "jobs", "secrets", "configmaps"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclass"]
  verbs: ["get", "list"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: beagclave-agent-binding
  namespace: beagclave-agents
subjects:
- kind: ServiceAccount
  name: beagclave-agent
  namespace: beagclave-agents
roleRef:
  kind: Role
  name: beagclave-agent-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: beagclave-agent-cluster
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/proxy"]
  verbs: ["get", "list"]
- apiGroups: ["extensions", "networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: beagclave-agent-cluster-binding
subjects:
- kind: ServiceAccount
  name: beagclave-agent
  namespace: beagclave-agents
roleRef:
  kind: ClusterRole
  name: beagclave-agent-cluster
  apiGroup: rbac.authorization.k8s.io