apiVersion: v1
kind: ConfigMap
metadata:
  name: fips-enforcement
  namespace: beagclave-system
  labels:
    security.beagclave.dev/fips: "enabled"
data:
  FIPS_ENFORCEMENT: "true"
  KERNEL_CRYPTO: "fips"
  OPENSSL_CONF: "/etc/ssl/openssl-fips.cnf"
  SYSTEMD_FIPS: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: fips-certificates
  namespace: beagclave-system
type: kubernetes.io/tls
type: kubernetes.io/tls
data:
  ca.crt: ""
  tls.crt: ""
  tls.key: ""
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fips-monitor
  namespace: beagclave-system
  labels:
    security.beagclave.dev/fips: "monitor"
spec:
  selector:
    matchLabels:
      name: fips-monitor
  template:
    metadata:
      labels:
        name: fips-monitor
        security.beagclave.dev/fips: "monitor"
    spec:
      serviceAccountName: beagclave-agent
      hostNetwork: true
      containers:
      - name: fips-checker
        image: ghcr.io/beagclave/fips-checker:latest
        securityContext:
          privileged: true
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        volumeMounts:
        - name: proc
          mountPath: /host/proc
          readOnly: true
      volumes:
      - name: proc
        hostPath:
          path: /proc