---
apiVersion: v1
kind: Secret
metadata:
  name: egress-tls
  namespace: beagclave-system
  type: kubernetes.io/tls
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-config
  namespace: beagclave-system
data:
  EGRESS_POLICY: "restricted"
  ALLOWED_EGRESS_HOSTS: |
    beagclave-purview.purview.azure.com
    beagclave-logs.ods.opinsights.azure.com
    beagclave-sentinel.sentinel.azure.com
    *.blob.core.windows.net
    *.vault.azure.net
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-egress
  namespace: beagclave-agents
spec:
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-purview-egress
  namespace: beagclave-agents
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  - to:
    - dnsNames:
      - "beagclave-purview.purview.azure.com"
    ports:
    - protocol: TCP
      port: 443
  - to:
    - dnsNames:
      - "*.blob.core.windows.net"
    ports:
    - protocol: TCP
      port: 443
  - to:
    - dnsNames:
      - "*.vault.azure.net"
    ports:
    - protocol: TCP
      port: 443
  - to:
    - dnsNames:
      - "beagclave-logs.ods.opinsights.azure.com"
    ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: beagclave-agents
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-cui-data-access
  namespace: beagclave-cui-data
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: beagclave-agents
    - namespaceSelector:
        matchLabels:
          name: beagclave-system
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: beagclave-logs
  - to:
    - dnsNames:
      - "beagclave-purview.purview.azure.com"
    ports:
    - protocol: TCP
      port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-non-us-itar
  namespace: beagclave-itar-data
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: beagclave-system
        matchExpressions:
        - key: export-control
          operator: NotIn
          values: ["non-us-person"]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-non-us-ear
  namespace: beagclave-ear-data
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: beagclave-system
        matchExpressions:
        - key: export-control
          operator: NotIn
          values: ["non-us-person"]
  egress: []