apiVersion: apps/v1
kind: Deployment
metadata:
  name: beagclave-worker
  namespace: beagclave-agents
  labels:
    app: beagclave-worker
    tier: compute
spec:
  replicas: 3
  selector:
    matchLabels:
      app: beagclave-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: beagclave-worker
        tier: compute
        data-tier: internal
        nist-control: SI-10
    spec:
      serviceAccountName: beagclave-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 2001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: worker
        image: ghcr.io/beagclave/worker:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: agent-secrets
        - configMapRef:
            name: egress-config
        env:
        - name: AZURE_AUTHORITY_HOST
          value: "https://login.microsoftonline.us"
        - name: AZURE_WORKLOAD_ID_TOKEN_FILE
          value: "/var/run/secrets/azure/tokens/beagclave-agent"
        - name: AGENT_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
        volumeMounts:
        - name: azure-token
          mountPath: /var/run/secrets/azure/tokens
          readOnly: true
        - name: workspace
          mountPath: /tmp/workspace
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      volumes:
      - name: azure-token
        projected:
          sources:
          - serviceAccountToken:
              path: beagclave-agent
              expirationSeconds: 3600
              audience: api://AzureADTokenExchange
      - name: workspace
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - beagclave-worker
              topologyKey: kubernetes.io/hostname
      tolerations:
      - key: "node-type"
        operator: "Equal"
        value: "agent-pool"
        effect: "NoSchedule"
      terminationGracePeriodSeconds: 60
---
apiVersion: apps/v1
kind: HorizontalPodAutoscaler
metadata:
  name: beagclave-worker-hpa
  namespace: beagclave-agents
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: beagclave-worker
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: v1
kind: Service
metadata:
  name: beagclave-worker
  namespace: beagclave-agents
  labels:
    app: beagclave-worker
    tier: compute
spec:
  type: ClusterIP
  selector:
    app: beagclave-worker
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 8081
    targetPort: 8081