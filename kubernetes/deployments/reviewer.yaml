apiVersion: apps/v1
kind: Deployment
metadata:
  name: beagclave-reviewer
  namespace: beagclave-agents
  labels:
    app: beagclave-reviewer
    tier: quality-control
spec:
  replicas: 2
  selector:
    matchLabels:
      app: beagclave-reviewer
  template:
    metadata:
      labels:
        app: beagclave-reviewer
        tier: quality-control
        data-tier: internal
        nist-control: CA-2
    spec:
      serviceAccountName: beagclave-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1002
        fsGroup: 2002
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: reviewer
        image: ghcr.io/beagclave/reviewer:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: agent-secrets
        - configMapRef:
            name: egress-config
        env:
        - name: AZURE_AUTHORITY_HOST
          value: "https://login.microsoftonline.us"
        - name: AZURE_WORKLOAD_ID_TOKEN_FILE
          value: "/var/run/secrets/azure/tokens/beagclave-agent"
        - name: REVIEW_STRICT_MODE
          value: "true"
        - name: AUDIT_LOG_PATH
          value: "/var/log/beagclave/audit.log"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: azure-token
          mountPath: /var/run/secrets/azure/tokens
          readOnly: true
        - name: audit-log
          mountPath: /var/log/beagclave
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      volumes:
      - name: azure-token
        projected:
          sources:
          - serviceAccountToken:
              path: beagclave-agent
              expirationSeconds: 3600
              audience: api://AzureADTokenExchange
      - name: audit-log
        emptyDir: {}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - beagclave-reviewer
            topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: beagclave-reviewer
  namespace: beagclave-agents
  labels:
    app: beagclave-reviewer
    tier: quality-control
spec:
  type: ClusterIP
  selector:
    app: beagclave-reviewer
  ports:
  - name: http
    port: 8080
    targetPort: 8080
