apiVersion: apps/v1
kind: Deployment
metadata:
  name: beagclave-planner
  namespace: beagclave-agents
  labels:
    app: beagclave-planner
    tier: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app: beagclave-planner
  template:
    metadata:
      labels:
        app: beagclave-planner
        tier: control-plane
        data-tier: internal
        nist-control: PL-2
    spec:
      serviceAccountName: beagclave-agent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: planner
        image: ghcr.io/beagclave/planner:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: agent-secrets
        - configMapRef:
            name: egress-config
        env:
        - name: AZURE_AUTHORITY_HOST
          value: "https://login.microsoftonline.us"
        - name: AZURE_WORKLOAD_ID_TOKEN_FILE
          value: "/var/run/secrets/azure/tokens/beagclave-agent"
        - name: LOG_LEVEL
          value: "info"
        - name: MAX_CONCURRENT_TASKS
          value: "10"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - name: azure-token
          mountPath: /var/run/secrets/azure/tokens
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      volumes:
      - name: azure-token
        projected:
          sources:
          - serviceAccountToken:
              path: beagclave-agent
              expirationSeconds: 3600
              audience: api://AzureADTokenExchange
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - beagclave-planner
            topologyKey: kubernetes.io/hostname
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "NoSchedule"
        effect: "NoSchedule"
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: beagclave-planner
  namespace: beagclave-agents
  labels:
    app: beagclave-planner
    tier: control-plane
spec:
  type: ClusterIP
  selector:
    app: beagclave-planner
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 8081
    targetPort: 8081
