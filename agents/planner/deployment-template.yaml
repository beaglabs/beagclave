---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beagclave-planner-template
  namespace: beagclave-agents
  annotations:
    beagclave.dev/template: "true"
    beagclave.dev/agent-type: "planner"
    beagclave.dev/required-tools: "purview-query,aks-exec,web-scraper"
spec:
  replicas: 0
  selector:
    matchLabels:
      app: planner-ephemeral
  template:
    metadata:
      labels:
        app: planner-ephemeral
        agent-type: planner
        data-tier: internal
    spec:
      serviceAccountName: beagclave-agent
      containers:
      - name: planner
        image: ghcr.io/beagclave/planner:{{IMAGE_TAG}}
        command: ["planner", "--ephemeral", "--session={{SESSION_ID}}"]
        envFrom:
        - secretRef:
            name: agent-secrets
        - configMapRef:
            name: agent-runtime-config
      volumes: []