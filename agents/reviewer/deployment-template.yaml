---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beagclave-reviewer-template
  namespace: beagclave-agents
  annotations:
    beagclave.dev/template: "true"
    beagclave.dev/agent-type: "reviewer"
    beagclave.dev/required-tools: "purview-query,sentinel-query,web-scraper"
spec:
  replicas: 0
  selector:
    matchLabels:
      app: reviewer-ephemeral
  template:
    metadata:
      labels:
        app: reviewer-ephemeral
        agent-type: reviewer
        data-tier: internal
    spec:
      serviceAccountName: beagclave-agent
      containers:
      - name: reviewer
        image: ghcr.io/beagclave/reviewer:{{IMAGE_TAG}}
        command: ["reviewer", "--ephemeral", "--session={{SESSION_ID}}"]
        envFrom:
        - secretRef:
            name: agent-secrets
        - configMapRef:
            name: agent-runtime-config
      volumes: []